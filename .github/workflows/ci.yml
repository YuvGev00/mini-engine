name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check src tests examples
      - run: uv run ruff check src tests examples
      - run: uv run mypy src tests
      # CPU only, tiny random Qwen3: no model download. The Qwen3-0.6B parity test is
      # opt-in locally via MINI_ENGINE_REAL_MODEL=1.
      - run: uv run pytest -q
