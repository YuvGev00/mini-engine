[project]
name = "mini-engine"
version = "0.1.0"
description = "A small, from-scratch LLM inference engine: paged KV cache, continuous batching, prefix caching"
readme = "README.md"
authors = [
    { name = "YuvGev00", email = "yuvgev1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.2.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["transformers.*", "safetensors.*", "huggingface_hub.*", "triton.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["mini_engine.triton_attention"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

# CI (Linux) uses the CPU-only torch wheels: ~200 MB instead of ~2.5 GB of CUDA libs.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
